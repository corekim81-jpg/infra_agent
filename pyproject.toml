[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "infra-agent"
version = "0.1.0.dev0"
description = "Python 기반 멀티 에이전트 인프라 운영 분석 시스템 (읽기 전용)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
infra-agent = "infra_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: 개발 서버 실제 데이터 소스에 연결하는 테스트 (INFRA_AGENT_LIVE_TESTS=1 필요)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "RUF001",  # 한국어 문서 문자열의 전각/유사 문자 경고 제외
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
