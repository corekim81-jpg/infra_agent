# infra_agent 설정 예시 — 비밀값·내부 서버 주소를 넣지 마세요.
# 실제 설정은 이 파일을 config/local.yaml로 복사해 수정합니다 (config/local.yaml은 Git에서 제외).
# 우선순위: 기본값 < 이 파일 < 환경 변수 (INFRA_AGENT__SECTION__KEY)
profile: dev-tunnel

datasources:
  # 아래 주소는 Windows 호스트에서 SSH 터널을 실행한 동안에만 유효합니다 (docs/environment.md 1.1절).
  prometheus:
    enabled: true
    url: http://127.0.0.1:19090
    timeout_seconds: 15
    token_env: null          # 인증이 필요하면 토큰을 담은 "환경 변수 이름"을 지정
  loki:
    enabled: true
    url: http://127.0.0.1:13100
    timeout_seconds: 20
  tempo:
    enabled: true
    url: http://127.0.0.1:13200
    timeout_seconds: 20
  kubernetes:
    enabled: false           # 전용 읽기 계정 kubeconfig 준비 후 true. 관리자 kubeconfig 사용 금지
    kubeconfig_env: INFRA_AGENT_KUBECONFIG
    context: null
  hubble:
    enabled: false           # 초기에는 Prometheus의 hubble_* 지표 사용

catalog:
  path: config/catalog/otel-demo.yaml   # 실행 위치(저장소 루트) 기준 상대 경로

llm:
  # fake: 모델 없음(규칙·코드 판정만) / claude_agent_sdk: pip install -e ".[llm]" 와 인증 필요
  provider: claude_agent_sdk
  model: null                # null이면 SDK 기본 모델
  # none | aggregated | full. 개발 환경(OTel Demo)은 full로 결정(2026-09-29).
  # 운영 환경의 외부 모델 전송 범위는 미확정이므로 운영 설정에 이 값을 그대로 쓰지 마세요.
  data_policy: full
  max_calls_per_request: 8
  max_turns_per_agent: 6
  max_budget_usd_per_request: null

execution:
  max_concurrency: 4
  request_timeout_seconds: 120
  agent_timeout_seconds: 60
  tool_timeout_seconds: 20
  max_retries: 2
  default_time_range: 30m

analysis:                    # 판정 기준 (제안 기본값)
  utilization_warning: 0.8   # 사용량/할당 가능량(또는 limit) 경고
  utilization_critical: 0.9
  throttling_warning: 0.25   # CPU 스로틀링 비율 경고
  increase_ratio: 0.5        # 직전 구간 평균 대비 50% 이상 증가 시 "증가"
  min_cpu_increase_cores: 0.05
  min_memory_increase_bytes: 104857600   # 100MiB
  stale_after_seconds: 300   # 최신 샘플이 5분보다 오래되면 데이터 지연
  top_n: 5
  max_tool_calls: 100       # 요청당 조회 호출 상한 (여러 에이전트가 공유, 최신성·대상 확인 조회 포함)
