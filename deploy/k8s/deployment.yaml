# HTTP API 상시 실행 (Deployment + 클러스터 내부 Service). 외부 노출(Ingress)은 포함하지 않습니다.
# 먼저 적용: deploy/rbac/infra-agent-reader.yaml, deploy/k8s/config.yaml
#
# API 토큰은 Secret으로 따로 만듭니다(값은 저장소·매니페스트에 넣지 않음):
#   kubectl -n infra-agent create secret generic infra-agent-api \
#     --from-literal=token="$(openssl rand -hex 32)"
#
#   kubectl apply -f deploy/k8s/deployment.yaml
#   kubectl -n infra-agent rollout status deploy/infra-agent
#
# 사용 (클러스터 밖에서 확인할 때는 port-forward). 로컬 포트(18080)는 비어 있는 포트로 정하세요.
# 이미 쓰는 포트를 고르면 port-forward가 실패하고 다른 프로그램이 응답합니다(먼저 /healthz 확인).
#   kubectl -n infra-agent port-forward svc/infra-agent 18080:8080
#   curl -s http://127.0.0.1:18080/healthz          # {"status":"ok"}
#   TOKEN=$(kubectl -n infra-agent get secret infra-agent-api -o jsonpath='{.data.token}' | base64 -d)
#   curl -s -X POST http://127.0.0.1:18080/v1/ask -H "Authorization: Bearer $TOKEN" \
#     -H 'Content-Type: application/json' -d '{"question":"현재 서버 상태가 어때?"}'
#
# 다른 네임스페이스에서 MCP(/mcp) 호출 점검: deploy/k8s/job-mcp-check.yaml
# 접속 가능한 네임스페이스 제한: deploy/k8s/networkpolicy-api-clients-example.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-agent
  namespace: infra-agent
  labels:
    app.kubernetes.io/name: infra-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infra-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infra-agent
    spec:
      serviceAccountName: infra-agent-reader
      automountServiceAccountToken: true   # ServiceAccount 기본값은 false, 이 Pod에서만 켭니다
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: infra-agent
          image: infra-agent:dev            # 빌드한 이미지 이름으로 바꾸세요
          imagePullPolicy: IfNotPresent
          args: ["serve", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: INFRA_AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infra-agent-api
                  key: token
          # 시작 직후 서버가 뜨기 전에 점검해 Warning 이벤트가 남지 않도록 처음 점검을 늦춥니다.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/infra-agent, readOnly: true}
            - {name: var, mountPath: /opt/infra-agent/var}
      volumes:
        - name: config
          configMap:
            name: infra-agent-config
        - name: var
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: infra-agent
  namespace: infra-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: infra-agent
  ports:
    - {name: http, port: 8080, targetPort: http}
