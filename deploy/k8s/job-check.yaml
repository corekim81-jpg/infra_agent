# 클러스터 내부 연결 점검 Job: Prometheus·Loki·Tempo 준비 상태와 Kubernetes API 버전·권한을 확인합니다.
# 먼저 적용: deploy/rbac/infra-agent-reader.yaml, deploy/k8s/config.yaml
#   kubectl apply -f deploy/k8s/job-check.yaml
#   kubectl -n infra-agent logs job/infra-agent-check
#   kubectl -n infra-agent delete job infra-agent-check     # 다시 실행하려면 삭제 후 적용
# 하나라도 연결되지 않으면 Job이 실패(종료 코드 1)하므로 결과를 로그에서 확인합니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: infra-agent-check
  namespace: infra-agent
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: infra-agent-reader
      automountServiceAccountToken: true   # ServiceAccount 기본값은 false, 이 Pod에서만 켭니다
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: infra-agent
          image: infra-agent:dev            # 빌드한 이미지 이름으로 바꾸세요
          imagePullPolicy: IfNotPresent
          args: ["check"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/infra-agent, readOnly: true}
            - {name: var, mountPath: /opt/infra-agent/var}
      volumes:
        - name: config
          configMap:
            name: infra-agent-config
        - name: var
          emptyDir: {}
